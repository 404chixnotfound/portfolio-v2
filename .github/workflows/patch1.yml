name: Apply patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o share-and-center-fix.zip
          rm share-and-center-fix.zip
          rm -rf .github
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Center media, new share image"
          git push
