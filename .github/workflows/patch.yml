name: Apply patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -la
          unzip -o about-update*.zip
          rm about-update*.zip
          rm -rf .github
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Update about copy"
          git push
