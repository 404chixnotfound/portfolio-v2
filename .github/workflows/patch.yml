name: Apply patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o mobile-and-nav-fix.zip
          rm mobile-and-nav-fix.zip
          rm -rf .github
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Fix mobile project layout and home reveal"
          git push
